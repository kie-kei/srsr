[package]
name = "srsr"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Collection-isolated Markdown search with Tantivy"
license = "MIT"
repository = "https://github.com/kie-kei/srsr"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
tantivy = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
pulldown-cmark = "0.13"
walkdir = "2"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
proptest = "1"

# Matches the release workflow's `srsr-<target>` archive names so
# `cargo binstall --git https://github.com/kie-kei/srsr srsr` downloads
# prebuilt binaries instead of compiling from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
