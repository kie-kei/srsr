[package]
name = "srsr"
version = "0.1.0"
edition = "2024"
description = "Collection-isolated Markdown search with Tantivy"
license = "MIT"
repository = "https://github.com/kie-kei/srsr"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tantivy = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
pulldown-cmark = "0.13"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
